<!DOCTYPE html>
<html><body style="background:#000;color:#0f0;font-family:monospace;padding:15px;font-size:14px;direction:ltr">
<h3>DIAGNOSTIC</h3>
<pre id="out">testing...</pre>
<script>
var log=[];
log.push('URL: '+location.href);
log.push('UA: '+navigator.userAgent.substring(0,60));
log.push('TG: '+(!!window.Telegram));
log.push('initData: '+((window.Telegram&&window.Telegram.WebApp&&window.Telegram.WebApp.initData)||'').length);

document.getElementById('out').innerText=log.join('\n');
log.push('---');
document.getElementById('out').innerText=log.join('\n');

fetch('https://nira-earn-bot.onrender.com/health')
.then(function(r){return r.json();})
.then(function(d){
  log.push('fetch OK: '+JSON.stringify(d));
  document.getElementById('out').innerText=log.join('\n');
})
.catch(function(e){
  log.push('fetch FAIL: '+e.message);
  var x=new XMLHttpRequest();
  x.open('GET','https://nira-earn-bot.onrender.com/health');
  x.onload=function(){log.push('XHR OK: '+x.responseText);document.getElementById('out').innerText=log.join('\n');};
  x.onerror=function(){log.push('XHR FAIL');document.getElementById('out').innerText=log.join('\n');};
  x.send();
  document.getElementById('out').innerText=log.join('\n');
});
</script>
</body></html>
