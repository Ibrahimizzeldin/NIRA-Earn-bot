<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NIRA Earn Bot - الإعلانات والمهام</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Adsgram SDK -->
  <script src="https://sad.adsgram.ai/js/sad-index.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #3b82f6;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --success-color: #22c55e;
      --border-color: #334155;
      --adsgram-color: #8b5cf6;
    }

    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      direction: rtl;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      background: var(--card-bg);
      padding: 6px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: var(--accent-color);
      color: #fff;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
      border: 1px solid var(--border-color);
    }

    .adsgram-card {
      border: 1px solid var(--adsgram-color);
      background: linear-gradient(135deg, #1e293b 0%, #2e1065 100%);
    }

    .card-title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .card-desc {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
    }

    .reward-badge {
      background: rgba(34, 197, 94, 0.15);
      color: var(--success-color);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
    }

    .btn {
      background: var(--accent-color);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-adsgram {
      background: var(--adsgram-color);
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      margin-bottom: 6px;
      color: var(--text-muted);
    }

    .form-control {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: #0f172a;
      color: var(--text-color);
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('tasks')">🎯 المهام المتاحة</button>
      <button class="tab-btn" onclick="switchTab('create')">➕ إنشاء حملة</button>
    </div>

    <!-- قسم المهام -->
    <div id="tab-tasks" class="tab-content active">
      <!-- كرت إعلانات الفيديو Adsgram -->
      <div class="card adsgram-card">
        <div class="card-title">🎬 شاهد فيديو واكسب GRAM</div>
        <div class="card-desc">شاهد فيديو إعلاني قصير لمدة 15 ثانية وراكم أرباحك فوراً.</div>
        <div class="card-footer">
          <span class="reward-badge">+0.001 GRAM</span>
          <button class="btn btn-adsgram" onclick="showAdsgramVideo()">مشاهدة الآن</button>
        </div>
      </div>

      <!-- قائمة الحملات الداخلية -->
      <div id="campaigns-list">
        <p style="text-align: center; color: var(--text-muted);">جاري تحميل الحملات...</p>
      </div>
    </div>

    <!-- قسم إنشاء حملة -->
    <div id="tab-create" class="tab-content">
      <div class="card">
        <div class="card-title">إنشاء حملة إعلانية جديدة</div>
        <div class="card-desc">ترويج لقناتك أو رابطك واجلب الزوار مقابل مكافآت بالـ GRAM أو USDT</div>
        
        <form id="create-campaign-form" onsubmit="handleCreateCampaign(event)">
          <div class="form-group">
            <label>عنوان الحملة / المهمة</label>
            <input type="text" id="title" class="form-control" placeholder="مثال: انضم لقناتنا على التليجرام" required>
          </div>

          <div class="form-group">
            <label>رابط الهدف (URL)</label>
            <input type="url" id="targetUrl" class="form-control" placeholder="https://t.me/your_channel" required>
          </div>

          <div class="form-group">
            <label>نوع الحملة</label>
            <select id="campaignType" class="form-control">
              <option value="direct">زيارة مباشرة ($0.0025)</option>
              <option value="with_verification">اشتراك مع تحقق آلي ($0.0030)</option>
              <option value="banner">بنر مميز ($0.0050)</option>
            </select>
          </div>

          <div class="form-group">
            <label>عملة الدفع</label>
            <select id="currency" class="form-control">
              <option value="GRAM">GRAM</option>
              <option value="USDT">USDT</option>
            </select>
          </div>

          <div class="form-group">
            <label>عدد النقرات المطلوبة</label>
            <input type="number" id="clicks" class="form-control" placeholder="100" required>
          </div>

          <button type="submit" class="btn" style="width: 100%;">إطلاق الحملة الآن</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) tg.expand();

    // تهيئة Adsgram (استبدل YOUR_BLOCK_ID بمعرف الكتلة الخاص بك من لوحة Adsgram)
    const AdController = window.Adsgram ? window.Adsgram.init({ blockId: "YOUR_BLOCK_ID" }) : null;

    function switchTab(tabName) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

      if (tabName === 'tasks') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('tab-tasks').classList.add('active');
        loadCampaigns();
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('tab-create').classList.add('active');
      }
    }

    async function loadCampaigns() {
      const container = document.getElementById('campaigns-list');
      const userId = tg?.initDataUnsafe?.user?.id || 'demo_user';
      try {
        const res = await fetch(`/api/campaigns/available/${userId}`);
        const data = await res.json();

        if (!data.campaigns || data.campaigns.length === 0) {
          container.innerHTML = '<div class="card"><p style="text-align:center;">لا توجد حملات متاحة حالياً.</p></div>';
          return;
        }

        container.innerHTML = data.campaigns.map(c => `
          <div class="card">
            <div class="card-title">${c.title}</div>
            <div class="card-desc">${c.description || 'أكمل المهمة للحصول على المكافأة.'}</div>
            <div class="card-footer">
              <span class="reward-badge">+${(c.cost_per_click * 0.6).toFixed(4)} ${c.currency}</span>
              <button class="btn" onclick="verifyTask('${c.id}', '${c.target_url}')">تنفيذ المهمة</button>
            </div>
          </div>
        `).join('');
      } catch (err) {
        container.innerHTML = '<div class="card"><p style="text-align:center; color:red;">خطأ في تحميل الحملات.</p></div>';
      }
    }

    async function verifyTask(campaignId, targetUrl) {
      if (tg) tg.openTelegramLink ? tg.openTelegramLink(targetUrl) : tg.openLink(targetUrl);
      else window.open(targetUrl, '_blank');

      const userId = tg?.initDataUnsafe?.user?.id || 'demo_user';

      try {
        const res = await fetch('/api/campaigns/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ telegramId: userId, campaignId })
        });
        const data = await res.json();

        if (res.ok) {
          alert(`تمت المهمة بنجاح! تم إضافة ${data.reward} ${data.currency} لرصيدك.`);
          loadCampaigns();
        } else {
          alert(data.error || 'فشل التحقق من المهمة');
        }
      } catch (e) {
        alert('حدث خطأ في الاتصال بالخادم');
      }
    }

    function showAdsgramVideo() {
      if (!AdController) {
        alert('إعلانات الفيديو غير متاحة حالياً.');
        return;
      }
      AdController.show().then((result) => {
        // إضافة المكافأة بعد المشاهدة الكاملة
        alert('شكرًا لمشاهدتك! تم إيداع المكافأة في رصيدك.');
      }).catch((result) => {
        alert('لم تكتمل مشاهدة الإعلان.');
      });
    }

    async function handleCreateCampaign(e) {
      e.preventDefault();
      const payload = {
        telegramId: tg?.initDataUnsafe?.user?.id || 'demo_user',
        title: document.getElementById('title').value,
        targetUrl: document.getElementById('targetUrl').value,
        campaignType: document.getElementById('campaignType').value,
        currency: document.getElementById('currency').value,
        clicks: parseInt(document.getElementById('clicks').value)
      };

      try {
        const res = await fetch('/api/campaigns/create', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (res.ok) {
          alert('تم إطلاق الحملة بنجاح!');
          document.getElementById('create-campaign-form').reset();
          switchTab('tasks');
        } else {
          alert('خطأ: ' + (data.error || 'فشل إنشاء الحملة'));
        }
      } catch (err) {
        alert('حدث خطأ أثناء الاتصال بالخادم.');
      }
    }

    loadCampaigns();
  </script>
</body>
</html>
