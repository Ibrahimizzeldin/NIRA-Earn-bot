<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NIRA Earn Bot - الإعلانات والمهام</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #3b82f6;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --success-color: #22c55e;
      --border-color: #334155;
    }

    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      direction: rtl;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
    }

    /* Tabs Bar */
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      background: var(--card-bg);
      padding: 6px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: var(--accent-color);
      color: #fff;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* Cards */
    .card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
      border: 1px solid var(--border-color);
    }

    .card-title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .card-desc {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
    }

    .reward-badge {
      background: rgba(34, 197, 94, 0.15);
      color: var(--success-color);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
    }

    .btn {
      background: var(--accent-color);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Form Inputs */
    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      margin-bottom: 6px;
      color: var(--text-muted);
    }

    .form-control {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: #0f172a;
      color: var(--text-color);
      box-sizing: border-box;
    }

    .form-control:focus {
      outline: none;
      border-color: var(--accent-color);
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Navigation Tabs -->
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('tasks')">🎯 المهام المتاحة</button>
      <button class="tab-btn" onclick="switchTab('create')">➕ إنشاء حملة</button>
    </div>

    <!-- Section 1: Available Tasks/Campaigns -->
    <div id="tab-tasks" class="tab-content active">
      <div id="campaigns-list">
        <p style="text-align: center; color: var(--text-muted);">جاري تحميل الحملات...</p>
      </div>
    </div>

    <!-- Section 2: Create Campaign -->
    <div id="tab-create" class="tab-content">
      <div class="card">
        <div class="card-title">إنشاء حملة إعلانية جديدة</div>
        <div class="card-desc">ترويج لقناتك أو رابطك واجلب الزوار مقابل مكافآت بالـ GRAM أو USDT</div>
        
        <form id="create-campaign-form" onsubmit="handleCreateCampaign(event)">
          <div class="form-group">
            <label>عنوان الحملة / المهمة</label>
            <input type="text" id="title" class="form-control" placeholder="مثال: انضم لقناتنا على التليجرام" required>
          </div>

          <div class="form-group">
            <label>رابط الهدف (URL)</label>
            <input type="url" id="link" class="form-control" placeholder="https://t.me/your_channel" required>
          </div>

          <div class="form-group">
            <label>عملة الدفع</label>
            <select id="currency" class="form-control">
              <option value="GRAM">GRAM</option>
              <option value="USDT">USDT</option>
            </select>
          </div>

          <div class="form-group">
            <label>الميزانية الإجمالية للحملة</label>
            <input type="number" step="0.001" id="totalBudget" class="form-control" placeholder="100" required>
          </div>

          <div class="form-group">
            <label>المكافأة لكل مشاهدة / نقرة</label>
            <input type="number" step="0.001" id="rewardPerView" class="form-control" placeholder="1" required>
          </div>

          <button type="submit" class="btn" style="width: 100%;">إطلاق الحملة الأن</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) tg.expand();

    function switchTab(tabName) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

      if (tabName === 'tasks') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('tab-tasks').classList.add('active');
        loadCampaigns();
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('tab-create').classList.add('active');
      }
    }

    async function loadCampaigns() {
      const container = document.getElementById('campaigns-list');
      try {
        const res = await fetch('/api/campaigns');
        const campaigns = await res.json();

        if (!campaigns || campaigns.length === 0) {
          container.innerHTML = '<div class="card"><p style="text-align:center;">لا توجد حملات إعلانية متاحة حالياً.</p></div>';
          return;
        }

        container.innerHTML = campaigns.map(c => `
          <div class="card">
            <div class="card-title">${c.title}</div>
            <div class="card-desc">قم بزيارة الرابط وأكمل المهمة للحصول على المكافأة.</div>
            <div class="card-footer">
              <span class="reward-badge">+${c.reward_per_view} ${c.currency}</span>
              <button class="btn" onclick="completeTask('${c.id}', '${c.link}')">تنفيذ المهمة</button>
            </div>
          </div>
        `).join('');
      } catch (err) {
        container.innerHTML = '<div class="card"><p style="text-align:center; color:red;">حدث خطأ أثناء تحميل البيانات.</p></div>';
      }
    }

    async function completeTask(campaignId, link) {
      if (tg) tg.openLink(link);
      else window.open(link, '_blank');

      try {
        await fetch('/api/campaigns/claim', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            userId: tg?.initDataUnsafe?.user?.id || 'demo_user',
            campaignId: campaignId
          })
        });
        alert('تم تسجيل زيارتك، وسيتم إضافة المكافأة لحسابك!');
      } catch (e) {
        console.error(e);
      }
    }

    async function handleCreateCampaign(e) {
      e.preventDefault();
      const payload = {
        userId: tg?.initDataUnsafe?.user?.id || 'demo_user',
        title: document.getElementById('title').value,
        link: document.getElementById('link').value,
        currency: document.getElementById('currency').value,
        totalBudget: parseFloat(document.getElementById('totalBudget').value),
        rewardPerView: parseFloat(document.getElementById('rewardPerView').value)
      };

      try {
        const res = await fetch('/api/campaigns/create', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (res.ok) {
          alert('تم إنشاء الحملة بنجاح!');
          document.getElementById('create-campaign-form').reset();
          switchTab('tasks');
        } else {
          alert('خطأ: ' + (data.error || 'تعذر إنشاء الحملة'));
        }
      } catch (err) {
        alert('حدث خطأ في الاتصال بالسيرفر.');
      }
    }

    // التحميل الأولي
    loadCampaigns();
  </script>
</body>
    </html>
